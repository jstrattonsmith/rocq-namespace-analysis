name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Nix path only -- GitHub-hosted runners won't have a matching pinned
    # Rocq/OCaml combo for the Homebrew path without real setup cost, and
    # Nix is already the documented "recommended" path in README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # flake.lock pins the exact nixpkgs revision already; no extra
          # nix_path/channel needed. Flakes + nix-command are on by default.
          extra_nix_config: |
            accept-flake-config = true

      - name: Run test suite
        run: nix develop -c bash test/run_test.sh
